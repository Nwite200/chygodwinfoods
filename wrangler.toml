# Cloudflare Pages configuration for Chygodwin Foodstuffs
# Local dev:  npx wrangler pages dev
# Deploy:     npx wrangler pages deploy dist

name = "chygodwinfoods"
compatibility_date = "2026-10-16"

[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "functions"

[[kv_namespaces]]
binding = "ADMIN_LIMITS_KV"
id = "87b134c887d34afba5da0a26eb3c6a7b"
preview_id = ""